aid: university-of-copenhagen
name: University of Copenhagen
x-type: university
x-category: Public Research University
description: >-
  The University of Copenhagen (Københavns Universitet, UCPH), founded in 1479, is Denmark's
  oldest and largest university and one of the leading research institutions in the Nordic
  region. It operates no central developer portal, no REST API program and no open-data
  portal — api.ku.dk and developer.ku.dk do not resolve, and data.ku.dk redirects to the
  homepage. What it does operate, and what makes it unusually well-covered for this cohort,
  is a set of standards-based machine-readable surfaces on its own infrastructure: a
  complete OAI-PMH 2.0 repository at curis.ku.dk serving 440,535 research records across
  7,430 sets in six metadata formats; a signed SAML 2.0 identity provider at id.ku.dk
  registered in the Danish WAYF federation; and thirteen Darwin Core Archive feeds published
  by the Natural History Museum of Denmark from specify-snm.science.ku.dk and harvested by
  GBIF. Its public research portal researchprofiles.ku.dk is by contrast an Elsevier Pure
  tenancy — it CNAMEs to ku.elsevierpure.com and its REST contract is Elsevier's, api-key
  gated — and is recorded here as a tenant relationship rather than as the university's own
  API. The only source code the institution publishes is the ku-kom GitHub account: 52
  repositories of TYPO3 content elements and a Bootstrap styleguide that build the ku.dk web
  platform.
