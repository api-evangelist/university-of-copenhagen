apis:
  - aid: university-of-copenhagen:curis-oai-pmh
    name: University of Copenhagen CURIS OAI-PMH Repository Interface
    x-operator: institution
    description: >-
      A complete, unauthenticated OAI-PMH 2.0 repository operated by the university on its
      own host. verb=Identify names the repository "University of Copenhagen", gives
      adminEmail curis@adm.ku.dk and attributes ownership to the org unit "KU Forskning og
      Informationssikkerhed". curis.ku.dk resolves to 130.226.237.49, inside the same
      University of Copenhagen /24 as cmsgw.adm.ku.dk and skema.ku.dk — this is the
      institution's own infrastructure, not the Elsevier tenancy. Six metadata formats
      (oai_dc, oai_cerif_openaire, mods, xmetadiss, fi-person, ddf-mxd), 7,430 sets, and
      440,535 records in oai_dc over openaire_cris_publications. Declares OpenAIRE CERIF
      compatibility level 1.1.1. The software underneath is Pure 5.30.3-3, but the protocol
      is an open OpenArchives standard, so the contract described is Copenhagen's deployment
      of a public standard rather than a vendor's proprietary API.
    baseURL: https://curis.ku.dk/ws/oai
    humanURL: https://researchprofiles.ku.dk/
    tags: [ Research, Repository, OAI-PMH, Metadata, Open Data, Institution-Operated ]
    properties:
      - type: OpenAPI
        url: openapi/university-of-copenhagen-curis-oai-pmh-openapi.yml
      - type: Examples
        url: examples/university-of-copenhagen-curis-oai-pmh-examples.yml
      - type: Authentication
        url: authentication/university-of-copenhagen-authentication.yml
      - type: ErrorCatalog
        url: errors/university-of-copenhagen-oai-pmh-errors.yml
      - type: Conformance
        url: conformance/university-of-copenhagen-conformance.yml
      - type: Documentation
        url: http://www.openarchives.org/OAI/openarchivesprotocol.html
  - aid: university-of-copenhagen:identity-federation
    name: University of Copenhagen SAML 2.0 Identity Provider
    x-operator: institution
    description: >-
      The university publishes a signed SAML 2.0 EntityDescriptor at
      https://id.ku.dk/nidp/saml2/metadata (200, 24,737 bytes, text/xml), entityID
      https://id.ku.dk/nidp/saml2/metadata. Three ku.dk SAML entities are registered in
      WAYF, the Danish national research-and-education federation and Denmark's eduGAIN
      participant: the id.ku.dk NetIQ Access Manager IdP, its test twin t-id.ku.dk, and a
      Windows AD FS endpoint at federation.ku.dk (registered but firewalled — it times out
      from the public internet). Verified in use: kunet.ku.dk redirects to
      id.ku.dk/nidp/wsfed/ep to authenticate. Identity federation is institution-operated by
      definition and is almost never catalogued for this cohort.
    baseURL: https://id.ku.dk/nidp/saml2/metadata
    humanURL: https://www.wayf.dk/
    tags: [ Identity Federation, SAML, WAYF, eduGAIN, Institution-Operated ]
    properties:
      - type: Metadata
        url: https://id.ku.dk/nidp/saml2/metadata
      - type: Documentation
        url: https://metadata.wayf.dk/birk-idp.xml
      - type: Authentication
        url: authentication/university-of-copenhagen-authentication.yml
  - aid: university-of-copenhagen:nhmd-darwin-core
    name: Natural History Museum of Denmark Darwin Core Archive Feeds
    x-operator: institution
    description: >-
      The Natural History Museum of Denmark, a University of Copenhagen faculty museum,
      publishes thirteen Darwin Core Archive exports from the Faculty of Science's own host
      specify-snm.science.ku.dk — entomology, mycology, ornithology, mammalogy, herpetology,
      ichthyology, invertebrate zoology, quaternary zoology, vertebrate palaeontology,
      vascular plants, biocultural botany, amber and the Danekræ collection. GBIF harvests
      them under publishing organization 2e7df380-8356-4533-bcb3-5459e23c794e (34 datasets
      in total; the remaining 21 arrive via ipt.danbif.dk and danbif.au.dk, which are not
      Copenhagen's infrastructure). These zips are the only bulk open-data downloads the
      university serves from a host it operates. The feed directory itself returns 403 to a
      listing request — normal for a directory of files, not a dead host; the individual
      archives under it return 200 application/zip.
    baseURL: https://specify-snm.science.ku.dk/static/depository/export_feed/
    humanURL: https://snm.dk/en
    tags: [ Open Data, Biodiversity, Darwin Core, GBIF, Institution-Operated ]
    properties:
      - type: DataDownload
        url: https://specify-snm.science.ku.dk/static/depository/export_feed/DwCA-QZ.zip
      - type: Documentation
        url: https://snm.dk/en
      - type: Conformance
        url: conformance/university-of-copenhagen-conformance.yml
  - aid: university-of-copenhagen:erda
    name: Electronic Research Data Archive (ERDA) and SCIENCE HPC Center
    x-operator: institution
    description: >-
      ERDA (erda.ku.dk, erda.dk, sid.erda.dk) is the university's research data archive,
      operated by the SCIENCE HPC Center at the Faculty of Science and skinned
      erda-ucph-science. UCPH users authenticate through id.ku.dk; external collaborators
      through oidc.erda.dk and cert.erda.dk. The archive exposes data over WebDAVS, SFTP and
      FTPS rather than a documented HTTP API, and no OpenAPI or /.well-known descriptor was
      found on any ERDA host. The associated SCIENCE HPC Center at hpc.ku.dk documents
      SLURM, Lustre, MPI, compiler and VGL access as web pages. Recorded as a real
      institution-operated research-computing surface with no machine-readable contract.
    humanURL: https://erda.ku.dk/
    tags: [ Research Computing, Research Data, Institution-Operated ]
    properties:
      - type: Website
        url: https://erda.ku.dk/
      - type: Documentation
        url: https://hpc.ku.dk/
  - aid: university-of-copenhagen:course-catalog
    name: University of Copenhagen Course Catalogue
    x-operator: institution
    description: >-
      kurser.ku.dk is the university's course catalogue, on a Copenhagen hostname running on
      Arcanic infrastructure (courses.loadbalancer.arcanic.dk). It serves human-readable
      course pages keyed by course code and a 471KB sitemap.xml enumerating every course,
      which is the only bulk-readable representation on offer — there is no JSON API,
      ?format=json returns the same HTML, and /api/ returns 404. The companion timetable
      host skema.ku.dk returned 503. Catalogued as a surface class the institution genuinely
      operates while being explicit that it is not programmable.
    humanURL: https://kurser.ku.dk/
    tags: [ Course Catalog, Registrar, Institution-Operated ]
    properties:
      - type: Website
        url: https://kurser.ku.dk/
      - type: Sitemap
        url: https://kurser.ku.dk/sitemap.xml
  - aid: university-of-copenhagen:research-portal-pure
    name: University of Copenhagen Research Portal (Elsevier Pure tenancy)
    x-operator: tenant
    description: >-
      researchprofiles.ku.dk is the university's public research portal and the front end of
      CURIS. It is an Elsevier Pure tenancy, not Copenhagen's engineering: the hostname
      CNAMEs researchprofiles.ku.dk -> ku.elsevierpure.com -> eu.prod.elsevierpure.com ->
      Cloudflare, the Identify block on the harvesting endpoint reports the software as Pure
      5.30.3-3 with acronym pure.atira.dk, and the REST contract at
      /ws/api/524/openapi.yaml is Elsevier's document, returned 401 without an api-key. The
      portal itself answers 403 with a Cloudflare interstitial to non-browser clients — live
      but bot-blocked. The data and the DOIs are Copenhagen's; the contract is Elsevier's,
      so no Pure specification is saved under this slug. The relationship is the fact worth
      recording. The institution's own harvesting interface over the same data is the
      separate curis-oai-pmh entry above.
    humanURL: https://researchprofiles.ku.dk/
    tags: [ Research, Repository, Pure, Elsevier, Tenant ]
    properties:
      - type: Website
        url: https://researchprofiles.ku.dk/
      - type: Vendor
        url: https://www.elsevier.com/products/pure
  - aid: university-of-copenhagen:datacite-xizz
    name: University of Copenhagen DataCite Membership (XIZZ)
    x-operator: tenant
    description: >-
      The university is an active DataCite member — provider symbol XIZZ, memberType
      consortium_organization, isActive true — with two registered repositories: xizz.curis
      ("CURIS", pointed at researchprofiles.ku.dk) and dk.ku ("University of Copenhagen").
      This is how Copenhagen mints persistent identifiers for its own research outputs. The
      API is DataCite's, the account and the DOIs are Copenhagen's, which is precisely the
      tenant shape.
    humanURL: https://api.datacite.org/providers/xizz
    tags: [ Persistent Identifiers, DataCite, DOI, Tenant ]
    x-audit-note: >-
      audit-university-contracts.py returns [vendor] for api.datacite.org because seven other
      institutions in the cohort point at the same host, and that verdict is correct about the
      HOST. It is not the whole fact. What is recorded here is Copenhagen's ACCOUNT on that
      platform — provider symbol XIZZ with two named repositories — which is the tenant shape
      the university pipeline exists to preserve. No DataCite contract, schema or artifact is
      saved under this slug; the only pointers below are the registry record and this repo's
      own conformance file.
    properties:
      - type: Registry
        url: https://api.datacite.org/providers/xizz
      - type: Conformance
        url: conformance/university-of-copenhagen-conformance.yml
  - aid: university-of-copenhagen:ku-kom-github
    name: University of Copenhagen Web Platform Source (ku-kom)
    x-operator: institution
    description: >-
      github.com/ku-kom is the university's GitHub account — a User account rather than an
      Organization, named "University of Copenhagen" and linked to www.ku.dk — publishing 52
      public repositories: the KU Bootstrap styleguide and a family of ucph_content_* TYPO3
      content elements (grids, tabs, accordions, modals, sliders, the UCPH employee
      directory, the UCPH system status element) that build the ku.dk web platform. Judged
      by what it says about itself rather than by the fact that it lives on a code host:
      these are the institution's own components. They are reusable source code, not a
      hosted, callable service, and no OpenAPI or other API contract is published in any of
      them.
    humanURL: https://github.com/ku-kom
    tags:
    - Open-Source
    - TYPO3
    - CMS
    - Web
    - Institution-Operated
    tags_raw:
