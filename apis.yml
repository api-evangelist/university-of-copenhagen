x-coverage:
  state: covered
  reason: covered
  detail: >-
    Re-profiled 2026-08-30 under the university pipeline. The June 2026 profile recorded one
    research-portal entry and asserted that the Pure endpoints "could not be confirmed
    reachable from the public internet" — that conclusion was reached by probing the wrong
    host. The Pure portal researchprofiles.ku.dk does not serve OAI-PMH (its /ws/oai returns
    500 and redirects to /error/), but curis.ku.dk does, and it answers all six OAI-PMH
    verbs at 200 unauthenticated. Two further institution-operated surfaces were found that
    had never been catalogued: the SAML 2.0 identity-provider metadata at id.ku.dk, and the
    Natural History Museum's Darwin Core Archive feeds on specify-snm.science.ku.dk. One
    correction runs the other way: researchprofiles.ku.dk was previously carried as
    institution-operated on the strength of its ku.dk hostname, and DNS resolution shows it
    CNAMEs to ku.elsevierpure.com; it is re-labelled x-operator tenant. Negative results are
    real too — www.ku.dk answers 200 with a 121,943-byte homepage for every unknown path, so
    llms.txt, /.well-known/security.txt, /.well-known/ai.txt and /en/ai are all soft-404s and
    none is credited.
